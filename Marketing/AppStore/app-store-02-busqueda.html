* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 2560px; height: 1600px; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; }
.desktop {

  display: flex; align-items: center; justify-content: space-between;
  padding: 0 16px 0 14px;
  color: rgba(0,0,0,0.82); font-size: 13px; font-weight: 500;
  position: relative; z-index: 10;
}
.menubar-left, .menubar-right { display: flex; align-items: center; gap: 18px; }
.menubar-left { gap: 16px; }
.menubar-right { gap: 14px; }
.menubar-item { opacity: 0.88; white-space: nowrap; }
.menubar-app { font-weight: 600; opacity: 1; }
.menubar-icon { display: flex; align-items: center; justify-content: center; opacity: 0.82; }
.menubar-icon svg { display: block; }
.menubar-datetime { font-size: 12.5px; font-weight: 500; letter-spacing: -0.1px; opacity: 0.88; margin-left: 2px; }
.menu-icon {

  margin-left: 2px;
}
.menu-icon img { width: 15px; height: 15px; display: block; }
.panel-wrap { position: absolute; top: 72px; right: 420px; }
.panel {
  width: 360px; min-height: 560px; border-radius: 12px; overflow: hidden;
  background: rgba(255,255,255,0.72); backdrop-filter: blur(28px) saturate(160%);
  border: 1px solid rgba(255,255,255,0.55); box-shadow: 0 18px 50px rgba(0,0,0,0.18);
  display: flex; flex-direction: column;
}
.header { padding: 14px; display: flex; align-items: center; justify-content: space-between; }
.header-left h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.2px; color: rgba(0,0,0,0.88); }
.header-left p { font-size: 11px; color: rgba(0,0,0,0.45); margin-top: 2px; }
.header-actions { display: flex; gap: 10px; align-items: center; color: rgba(0,0,0,0.45); }
.divider { height: 1px; background: rgba(0,0,0,0.08); }
.searchbar {
  display: flex; align-items: center; gap: 8px; padding: 10px 14px;
  background: rgba(0,0,0,0.04); color: rgba(0,0,0,0.55); font-size: 13px;
}
.searchbar input { border: none; background: transparent; outline: none; width: 100%; font: inherit; color: rgba(0,0,0,0.82); }
.cards { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.card {
  position: relative; border-radius: 16px; padding: 12px;
  background: rgba(255,255,255,0.95); border: 1px solid rgba(0,0,0,0.08);
}
.card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; color: rgba(0,0,0,0.45); font-size: 11px; }
.card-label { display: flex; align-items: center; gap: 5px; }
.card-body { font-size: 13px; line-height: 1.45; color: rgba(0,0,0,0.86); margin-bottom: 10px; }
.card-bottom { display: flex; justify-content: space-between; align-items: center; font-size: 10px; color: rgba(0,0,0,0.45); }
.trash { color: rgba(0,0,0,0.38); display: flex; align-items: center; }
.image-preview {
  height: 148px; border-radius: 12px; background: rgba(0,0,0,0.05);
  display: flex; align-items: center; justify-content: center; overflow: hidden; margin-bottom: 10px;
}
.image-preview img { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; }
.overlay {
  position: absolute; inset: 0; border-radius: 16px; background: rgba(0,0,0,0.45);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  color: white; gap: 8px; font-size: 11px; font-weight: 600;
}
.footer { padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: rgba(0,0,0,0.45); }
.footer button { border: none; background: transparent; font: inherit; color: inherit; cursor: default; }
.hero { position: absolute; inset: 44px 0 0 0; display: grid; grid-template-columns: 1fr 1fr; align-items: center; padding: 80px 140px 0; gap: 80px; }
.hero-copy h2 { font-size: 64px; line-height: 1.05; letter-spacing: -1.5px; color: rgba(0,0,0,0.88); margin-bottom: 24px; }
.hero-copy p { font-size: 28px; line-height: 1.35; color: rgba(0,0,0,0.55); max-width: 900px; }
.hero .panel-wrap { position: relative; top: auto; right: auto; justify-self: center; }
